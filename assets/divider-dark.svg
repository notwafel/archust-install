<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28" role="img" aria-label=""><defs><style>
.fu{opacity:0;animation:fu .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .55s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.row{opacity:0;animation:row .35s ease-out forwards}
@keyframes row{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.blink{animation:bl 1.1s steps(1) infinite}
@keyframes bl{0%,55%{opacity:1}56%,100%{opacity:0}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.glow{animation:gl 7s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.55}50%{opacity:1}}
.act{opacity:0;animation:act 9s ease-in-out infinite}
@keyframes act{0%{opacity:0}4%{opacity:1}14%{opacity:1}20%{opacity:0}100%{opacity:0}}
.sweep{animation:sw 6s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-120px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(900px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}.act{opacity:0!important}}
</style><linearGradient id="dv" x1="0" x2="1"><stop offset="0" stop-color="#4aa8e8" stop-opacity="0"/><stop offset=".25" stop-color="#4aa8e8"/><stop offset=".5" stop-color="#a371f7"/><stop offset=".75" stop-color="#ff7a3d"/><stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/></linearGradient></defs><rect x="0" y="13" width="900" height="2" rx="1" fill="url(#dv)" opacity=".85"/><g class="sweep"><rect x="0" y="12" width="90" height="4" rx="2" fill="#f0f6fc" opacity=".7"/></g><g><rect x="438" y="6" width="16" height="16" rx="4" transform="rotate(45 446 14)" fill="#161b22" stroke="#a371f7" stroke-width="1.6"/><circle cx="446" cy="14" r="2.6" fill="#a371f7"/></g></svg>